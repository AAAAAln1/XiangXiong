<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>象雄 Xiangxiong</title>
    
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #e4e4e4;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Header */
        #header {
            background-color: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #cccccc;
        }
        
        #status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f48771;
        }
        
        .status-dot.connected {
            background-color: #4ec9b0;
        }
        
        /* Main Layout */
        #main {
            display: flex;
            height: calc(100vh - 49px);
        }
        
        /* Chat Area */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        
        .message.user {
            align-items: flex-end;
        }
        
        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        
        .message.user .message-bubble {
            background-color: #0e639c;
            color: #ffffff;
        }
        
        .message.agent .message-bubble {
            background-color: #2d2d2d;
            color: #cccccc;
        }
        
        .message.system .message-bubble {
            background-color: #1e3a1e;
            color: #4ec9b0;
            font-size: 13px;
            max-width: 100%;
        }
        
        .message.tool {
            background-color: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
        }
        
        .tool-header {
            color: #4ec9b0;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }
        
        .tool-content {
            background-color: #252526;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            color: #cccccc;
            overflow-x: auto;
        }
        
        .tool-content.collapsed {
            display: none;
        }
        
        /* Input Area */
        #input-container {
            padding: 16px 20px;
            background-color: #252526;
            border-top: 1px solid #3e3e42;
            display: flex;
            gap: 12px;
        }
        
        #input {
            flex: 1;
            background-color: #3c3c3c;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 12px;
            color: #cccccc;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            height: 44px;
        }
        
        #input:focus {
            outline: none;
            border-color: #0e639c;
        }
        
        #send-btn {
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        #send-btn:hover {
            background-color: #1177bb;
        }
        
        #send-btn:disabled {
            background-color: #3e3e42;
            cursor: not-allowed;
        }
        
        /* Right Panel */
        #right-panel {
            width: 400px;
            background-color: #252526;
            display: flex;
            flex-direction: column;
        }
        
        #tabs {
            display: flex;
            background-color: #2d2d2d;
            border-bottom: 1px solid #3e3e42;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            color: #969696;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: #cccccc;
        }
        
        .tab.active {
            color: #ffffff;
            border-bottom-color: #0e639c;
        }
        
        #panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .panel-section {
            display: none;
        }
        
        .panel-section.active {
            display: block;
        }
        
        /* Memory Panel */
        #memory-content {
            line-height: 1.6;
        }
        
        #memory-content h1,
        #memory-content h2,
        #memory-content h3 {
            color: #4ec9b0;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        #memory-content code {
            background-color: #1e1e1e;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
        }
        
        #memory-content pre {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }
        
        #memory-content pre code {
            background: none;
            padding: 0;
        }
        
        /* Artifacts Panel */
        .artifact-item {
            background-color: #2d2d2d;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .artifact-item:hover {
            background-color: #3c3c3c;
        }
        
        .artifact-name {
            color: #4ec9b0;
            font-size: 13px;
            font-weight: 600;
        }
        
        .artifact-path {
            color: #969696;
            font-size: 11px;
            margin-top: 4px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>象雄 Xiangxiong</h1>
        <div id="status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </div>
    
    <div id="main">
        <!-- Chat Area -->
        <div id="chat-container">
            <div id="messages"></div>
            <div id="input-container">
                <textarea id="input" placeholder="输入消息..." rows="1"></textarea>
                <button id="send-btn" disabled>发送</button>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div id="right-panel">
            <div id="tabs">
                <div class="tab active" data-tab="memory">Memory</div>
                <div class="tab" data-tab="artifacts">Artifacts</div>
            </div>
            <div id="panel-content">
                <div id="memory-panel" class="panel-section active">
                    <div id="memory-content">正在加载...</div>
                </div>
                <div id="artifacts-panel" class="panel-section">
                    <div id="artifacts-list">正在加载...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize
        const messagesDiv = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const memoryContent = document.getElementById('memory-content');
        
        let ws = null;
        let isConnected = false;
        
        // Configure marked
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });
        
        // WebSocket connection
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                isConnected = true;
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                sendBtn.disabled = false;
                addSystemMessage('已连接到象雄');
            };
            
            ws.onmessage = (event) => {
                handleMessage(event.data);
            };
            
            ws.onerror = (error) => {
                addSystemMessage('连接错误');
            };
            
            ws.onclose = () => {
                isConnected = false;
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                sendBtn.disabled = true;
                addSystemMessage('连接已断开');
                
                // Reconnect after 5s
                setTimeout(connect, 5000);
            };
        }
        
        // Handle incoming message
        function handleMessage(data) {
            try {
                const msg = JSON.parse(data);
                
                switch (msg.type) {
                    case 'agent_output':
                        addAgentMessage(msg.content);
                        break;
                    case 'memory_update':
                        updateMemory(msg.content);
                        break;
                    case 'artifacts':
                        updateArtifacts(msg.items);
                        break;
                    default:
                        // Raw output
                        addAgentMessage(data);
                }
            } catch (e) {
                // Not JSON, treat as raw output
                addAgentMessage(data);
            }
        }
        
        // Add messages
        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(div);
            scrollToBottom();
        }
        
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(div);
            scrollToBottom();
        }
        
        function addAgentMessage(text) {
            const div = document.createElement('div');
            div.className = 'message agent';
            div.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(div);
            scrollToBottom();
        }
        
        // Update Memory panel
        function updateMemory(markdown) {
            memoryContent.innerHTML = marked.parse(markdown);
        }
        
        // Update Artifacts panel
        function updateArtifacts(items) {
            const list = document.getElementById('artifacts-list');
            if (items.length === 0) {
                list.innerHTML = '<div style="color: #969696;">暂无Artifacts</div>';
                return;
            }
            
            list.innerHTML = items.map(item => `
                <div class="artifact-item" onclick="viewArtifact('${item.path}')">
                    <div class="artifact-name">${item.name}</div>
                    <div class="artifact-path">${item.path}</div>
                </div>
            `).join('');
        }
        
        // Send message
        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !isConnected) return;
            
            addUserMessage(text);
            ws.send(text + '\n');
            inputEl.value = '';
            inputEl.style.height = '44px';
        }
        
        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        inputEl.addEventListener('input', () => {
            // Auto-resize
            inputEl.style.height = '44px';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
        });
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                
                // Update tabs
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Update panels
                document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));
                document.getElementById(`${tabName}-panel`).classList.add('active');
            });
        });
        
        // Helpers
        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function viewArtifact(path) {
            // TODO: implement artifact viewer
            alert('查看: ' + path);
        }
        
        // Start
        connect();
        
        // Welcome message
        addSystemMessage('象雄 Console - 纯展示层');
        addSystemMessage('输入消息与象雄对话...');
    </script>
</body>
</html>
